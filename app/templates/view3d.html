    <!-- Load repository_config.js synchronously 
             Synchronous XHR ensures loading order: The browser halts execution until repository_config.js is fetched and executed, 
            ensuring that all variables are available. If repository_config.js fails to load, a console error message will help diagnose issues.
            xhrs block the browser’s rendering and prevent the user from interacting with the page until the request completes. However, this
            pause shoud be brief.-->
    <script>
        console.log("Starting the script ");// + Cesium.Ion.defaultAccessToken)
        // Dynamically create and load the configuration script synchronously before loading other scripts
        let branch = "{{ branch }}";
        let configFilePath = `/static/config/${branch === "main" ? "" : branch + "/"}repository_config.js`;

        if (branch !== "main" && branch !== "prod") {
            alert("[WARN] Loading configuration from the branch: [" + branch + "]\n" + configFilePath);
        }

        // Load repository_config.js synchronously to ensure its variables are available before other scripts run
        let xhr = new XMLHttpRequest();
        xhr.open('GET', configFilePath, false); // `false` makes the request synchronous
        xhr.onload = function () {
            if (xhr.status === 200) {
                let script = document.createElement('script');
                script.text = xhr.responseText;
                document.head.appendChild(script);

                // Function to capitalize the branch name
                function capitalizeBranchName(branch) {
                    return branch.charAt(0).toUpperCase() + branch.slice(1);
                }
                // Dynamically update the page title if the branch is not "main"
                if (branch !== "main" && branch !== "prod") {
                    let currentTitle = document.title;
                    let domain = window.location.hostname;
                    let capitalizedBranch = capitalizeBranchName(branch);
                    document.title = `[${capitalizedBranch} - ${domain}] ${currentTitle}`;
                }
            } else {
                console.error("Failed to load repository_config.js");
            }
        };
        xhr.send(null);

        // The config only ships a placeholder; the real Cesium Ion token comes from the server.
        let tokenXhr = new XMLHttpRequest();
        tokenXhr.open('GET', '/get-token', false);
        tokenXhr.send(null);
        if (tokenXhr.status === 200) {
            const ionToken = JSON.parse(tokenXhr.responseText).token;
            if (ionToken && ionToken !== 'your_access_token') {
                Cesium.Ion.defaultAccessToken = ionToken;
            }
        } else {
            console.error('Failed to load Cesium Ion token; imagery and terrain will not load.');
        }
    </script>

    <script>

        // Opacity for the items outside the study area.
        const outsideOpacity = 0.15
        // Lines need a higher floor than polygon outlines to stay visible on the dark globe.
        const outsideLineOpacity = 0.6

        let earthquakeDataSource;

        // CFM area display parameters.
        const cfmAreaOutlineColor = [Cesium.Color.CYAN]
        const cfmAreaFaceColor = [Cesium.Color.CYAN]
        const cfmAreaLabel = ["CFM Study Area"]
        const cfmAreaFillOpacity = [0.1]

        // Handling the 2D Geojson data.
        document.addEventListener('DOMContentLoaded', function () {
            // Accordion toggles
            document.querySelectorAll('.acc-header').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    this.closest('.acc-section').classList.toggle('open');
                });
            });

            // Load the logo after the HTML is loaded.
            // Select the image element by its ID
            const logoImage = document.getElementById('logo-image');

            // Set the src attribute to the desired image URL
            logoImage.src = logoFile;


            function handleGeoJsonData(checkboxId, dataArray, labelArray, colorArray, lineWidthArray, fillOpacityArray, dataSourcesArray, applyBoundingBoxFilter, extraLogic) {
                var checkbox = document.getElementById(checkboxId);
                // ↓↓↓ DEBUG: log the cfmData that this function receives
                console.log('[CFM] handleGeoJsonData received dataArray:', dataArray);
                function handleData(checked) {
                    if (checked) {
                        for (var i = 0; i < dataArray.length; i++) {
                            (function (index) {
                                Cesium.GeoJsonDataSource.load(dataArray[index], {
                                    label: labelArray[index],
                                    stroke: colorArray[index],
                                    fill: colorArray[index].withAlpha(fillOpacityArray[index]),
                                    strokeWidth: lineWidthArray[index],
                                    markerSymbol: '?'
                                }).then(function (dataSource) {
                                    if (applyBoundingBoxFilter) {
                                        const now = Cesium.JulianDate.now();
                                        const isInside = (pos) => {
                                            const cart = Cesium.Cartographic.fromCartesian(pos);
                                            const lon = Cesium.Math.toDegrees(cart.longitude);
                                            const lat = Cesium.Math.toDegrees(cart.latitude);
                                            return lon >= west && lon <= east && lat >= south && lat <= north;
                                        };
                                        const entities = dataSource.entities.values;
                                        entities.forEach((entity) => {
                                            let positions = [];
                                            if (Cesium.defined(entity.polygon)) {
                                                const h = entity.polygon.hierarchy.getValue(now);
                                                if (h) positions = h.positions || h;
                                            } else if (Cesium.defined(entity.polyline)) {
                                                positions = entity.polyline.positions.getValue(now);
                                            }
                                            if (positions.length && positions.every((p) => !isInside(p))) {
                                                if (entity.polygon) {
                                                    entity.polygon.material = colorArray[index].withAlpha(0.0);
                                                    entity.polygon.outlineColor = colorArray[index].withAlpha(outsideOpacity);
                                                }
                                                if (entity.polyline) {
                                                    entity.polyline.material = new Cesium.ColorMaterialProperty(
                                                        colorArray[index].withAlpha(outsideLineOpacity)
                                                    );
                                                }
                                            }
                                        });
                                    }

                                    if (extraLogic) {
                                        try {
                                            extraLogic(dataSource, index);
                                        } catch (e) {
                                            console.error('Error in extraLogic:', e);
                                        }
                                    }

                                    dataSourcesArray.push(dataSource);
                                    // Wait for viewer to be initialized before adding data
                                    function addWhenReady() {
                                        if (typeof viewer !== 'undefined' && viewer.dataSources) {
                                            viewer.dataSources.add(dataSource);
                                        } else {
                                            setTimeout(addWhenReady, 100);
                                        }
                                    }
                                    addWhenReady();
                                }).catch(function (error) {
                                    console.error('Error loading GeoJSON:', error);
                                });
                            })(i);
                        }
                    } else {
                        for (var i = 0; i < dataSourcesArray.length; i++) {
                            if (viewer.dataSources.contains(dataSourcesArray[i])) {
                                viewer.dataSources.remove(dataSourcesArray[i]);
                            }
                        }
                        dataSourcesArray.length = 0; // Clear the array
                    }
                }

                checkbox.addEventListener('change', function () {
                    handleData(this.checked);
                });

                handleData(checkbox.checked);
            }
            // Function to populate the dropdown menu dynamically using auxLabel array
            function populateDropdown() {
                const dropdown = document.getElementById('select2dSurface');

                // Clear existing options (if any)
                dropdown.innerHTML = '';

                // Add options from auxLabel array
                auxLabel.forEach((label, index) => {
                    const option = document.createElement('option');
                    option.value = index;  // Set value as the index in the array
                    option.textContent = label;  // Set the display text from the array
                    dropdown.appendChild(option);

            }

            // Function to enforce a maximum of 2 selections
            function enforceSelectionLimit() {
                const dropdown = document.getElementById('select2dSurface');
                const selectedOptions = Array.from(dropdown.selectedOptions);

                // Enforce selection limit of 2
                if (selectedOptions.length > 2) {
                    // Deselect the latest selected option
                    selectedOptions[selectedOptions.length - 1].selected = false;
                    alert('You can only select a maximum of 2 options.');
                }

            // Function to update the legend
            function updateLegend() {
                const dropdown = document.getElementById('select2dSurface');
                const selectedOptions = Array.from(dropdown.selectedOptions);
                const legend = document.getElementById('legend');

                // Clear the current legend
                legend.innerHTML = '';
                // Loop over selected options and add to legend

                    const selectedValue = option.value;
                    const color = auxColor[selectedValue];  // Get the color for the selected option

                    label.textContent = auxLabel[selectedValue];  // Label from the auxLabel array

                    // Add the color box and label to the legend item
                    legendItem.appendChild(colorBox);
                    legendItem.appendChild(label);

                    // Add the legend item to the legend div
                    legend.appendChild(legendItem);
                });

            // Function to handle the dropdown change event
            var auxDataSources = [];

                const dropdown = document.getElementById('select2dSurface');

                // Check if there are any selections

                } else {
                    checkbox.checked = false;

                // Clear items from the last selection, if any

                for (var i = 0; i < auxDataSources.length; i++) {

                    if (viewer.dataSources.contains(auxDataSources[i])) {
                        viewer.dataSources.remove(auxDataSources[i]);
                    }
                }
                auxDataSources.length = 0; // Clear the array

                // Loop over selected options and handle each selection
                selectedOptions.forEach(option => {
                    const selectedValue = option.value;
                    handleGeoJsonData(
                        'toggle2dSurfaceCheckbox',
                        [auxData[selectedValue]],
                        [auxLabel[selectedValue]],
                        [auxColor[selectedValue]],
                        [auxLineWidth[selectedValue]],
                        [auxFillOpacity[selectedValue]],
                        auxDataSources,
                        false,
                        function (dataSource, index) {
                            var surfaceName = auxLabel[selectedValue];
                            dataSource.entities.values.forEach(function (entity) {
                                entity.name = surfaceName;
                                var description = '<b>' + surfaceName + '</b><br/>';

                                properties.propertyNames.forEach(function (prop) {
                                    description += prop + ': ' + properties[prop].getValue() + '<br/>';

                                entity.description = description;
                            });

                });

                // Update the legend whenever the selection changes
                updateLegend();

            // Call the populateDropdown function to add the options from auxLabel array
            populateDropdown();

            // Add event listener to the dropdown
            document.getElementById('select2dSurface').addEventListener('change', function () {
                enforceSelectionLimit();
                handleDropdownChange();
            });
            // Add event listener to the dropdown
            // document.getElementById('toggle2dSurfaceCheckbox').addEventListener('change', function () {

            //});
            document.getElementById('toggle2dSurfaceCheckbox').addEventListener('change', function () {
                const checkbox = this;

                if (checkbox.checked) {
                    // Handle current dropdown selections when checked
                    handleDropdownChange();
                } else {
                    // Clear previous data sources when unchecked
                    for (var i = 0; i < auxDataSources.length; i++) {
                        if (viewer.dataSources.contains(auxDataSources[i])) {
                            viewer.dataSources.remove(auxDataSources[i]);
                        }
                    }
                    auxDataSources.length = 0; // Clear the array

                    // Optionally clear the selected options in the dropdown
                    const dropdown = document.getElementById('select2dSurface');
                    dropdown.selectedIndex = -1; // Deselect all options

                    // Clear the legend
                    const legend = document.getElementById('legend');
                    legend.innerHTML = '';
                }
            });

            const dropdown = document.getElementById('select2dSurface');
            // Default to Slab2 - Hayes model
            var slab2Idx = Array.from(dropdown.options).findIndex(function (o) { return o.text.indexOf('Slab2') !== -1; });
            dropdown.options[slab2Idx !== -1 ? slab2Idx : 0].selected = true;
            const checkbox = document.getElementById('toggle2dSurfaceCheckbox');
            checkbox.checked = true;
            enforceSelectionLimit();
            handleDropdownChange();

            // Boundary lines.
            var boundaryDataSources = [];
            handleGeoJsonData('toggleBoundaryCheckbox', boundaryData, boundaryLabel, boundaryColor, boundaryLineWidth, boundaryFillOpacity, boundaryDataSources, true);

            // CFM data with additional logic
            var cfmDataSources = [];
            handleGeoJsonData(
                'toggleCFMCheckbox',
                cfmData,
                cfmLabel,
                cfmColor,
                cfmLineWidth,
                cfmFillOpacity,
                cfmDataSources,
                false,
                function (dataSource, index) {
                    // Store direct reference for high-res swap logic
                    cfmSurfacesDS = dataSource;

                    var entitiesToRemove = [];
                    dataSource.entities.values.forEach(function (entity) {
                        var ok = true;
                        // Display all if selectedLines is empty.
                        if (selectedLines.length != 0) {
                            let eid = entity.properties.id ? String(entity.properties.id.getValue ? entity.properties.id.getValue() : entity.properties.id) : '';
                            let cfmId = entity.properties.CFM_ID ? String(entity.properties.CFM_ID.getValue ? entity.properties.CFM_ID.getValue() : entity.properties.CFM_ID) : '';
                            if (!selectedLines.includes(eid) && !selectedLines.includes(cfmId)) {
                                ok = false;
                                entitiesToRemove.push(entity);
                            }
                        }
                        if (ok) {
                            if (Cesium.defined(entity.polygon)) {
                                var hierarchy = entity.polygon.hierarchy.getValue();
                                if (hierarchy && hierarchy.positions) {
                                    hierarchy.positions.forEach(function (coordinate) {
                                        Cesium.Cartographic.fromCartesian(coordinate);
                                    });
                                }
                            } else if (Cesium.defined(entity.polyline)) {
                                var positions = entity.polyline.positions.getValue();
                                if (positions) {
                                    positions.forEach(function (position) {
                                        Cesium.Cartographic.fromCartesian(position);
                                    });
                                }
                            }
                            var description = '';
                            var properties = entity.properties;
                            properties.propertyNames.forEach(function (propertyName) {
                                description += propertyName + ': ' + properties[propertyName].getValue() + '<br />';
                            });
                            entity.description = description;
                        }
                    });

                    entitiesToRemove.forEach(function (entity) {
                        dataSource.entities.remove(entity);
                    });
                }

            // CFM Trace data with additional logic
            var cfmTraceDataSources = [];
            handleGeoJsonData(
                'toggleCFMTraceCheckbox',
                cfmTraceData,
                cfmTraceLabel,
                cfmTraceColor,
                cfmTraceLineWidth,
                cfmTraceFillOpacity,
                cfmTraceDataSources,
                false,
                function (dataSource, index) {
                    var entitiesToRemove = [];
                    dataSource.entities.values.forEach(function (entity) {
                        var ok = true;
                        // Display all if selectedLines is empty.
                        if (selectedLines.length != 0) {
                            let eid = entity.properties.id ? String(entity.properties.id.getValue ? entity.properties.id.getValue() : entity.properties.id) : '';
                            let cfmId = entity.properties.CFM_ID ? String(entity.properties.CFM_ID.getValue ? entity.properties.CFM_ID.getValue() : entity.properties.CFM_ID) : '';
                            if (!selectedLines.includes(eid) && !selectedLines.includes(cfmId)) {
                                ok = false;
                                entitiesToRemove.push(entity);
                            }
                        }
                        if (ok) {
                            if (Cesium.defined(entity.polygon)) {
                                var hierarchy = entity.polygon.hierarchy.getValue();
                                if (hierarchy && hierarchy.positions) {

                            } else if (Cesium.defined(entity.polyline)) {

        });



        console.log("Setting the viewer ");// + Cesium.Ion.defaultAccessToken)
        // Imagery layers our Cesium ion account can load. Sentinel-2, Blue Marble and Earth at
        // night are not in the account (404), and Stadia styles need an API key in production.
        const workingImagery = Cesium.createDefaultImageryProviderViewModels().filter(function (vm) {
            return !/Sentinel-2|Blue Marble|Earth at night|Stadia/i.test(vm.name);
        });
        const defaultImagery = workingImagery.find(function (vm) { return vm.name === 'Bing Maps Aerial'; });
        const terrainChoices = Cesium.createDefaultTerrainProviderViewModels();

        var viewer = new Cesium.Viewer('cesiumContainer', {
            depthPlaneEllipsoidOffset: 10000,
            nearToFarRatio: 1e6,
            farToNearRatio: 1e-6,
            sceneMode: Cesium.SceneMode.SCENE3D,
            scene3DOnly: true,
            skyBox: false, // Disable default skybox
            skyAtmosphere: false, // Disable sky atmosphere
            enableCollisionDetection: false,
            navigationInstructionsInitiallyVisible: true,
            // Letting the layer picker own the base layer gives its button an icon.
            imageryProviderViewModels: workingImagery,
            selectedImageryProviderViewModel: defaultImagery,

            selectedTerrainProviderViewModel: terrainChoices.find(function (vm) { return /World Terrain/.test(vm.name); }),
            globe: new Cesium.Globe(Cesium.Ellipsoid.WGS84, {
                minimumZoomDistance: 0.0
            })
        });

        // Set background color to black
        viewer.scene.backgroundColor = Cesium.Color.BLACK;

        // Allow the infoBox iframe to run scripts so the Load High-Res button can call parent
        viewer.infoBox.frame.setAttribute('sandbox',
            'allow-same-origin allow-scripts allow-popups allow-forms');
        viewer.infoBox.frame.src = 'about:blank';

        // The north arrow.
        function updateNorthArrow() {
            var heading = Cesium.Math.toDegrees(viewer.camera.heading);
            document.getElementById('northArrow').style.transform = 'rotate(' + (-heading) + 'deg)';
        }
        // Ensure update on initial load
        updateNorthArrow();


        // Bind updateNorthArrow to the postRender event
        viewer.scene.postRender.addEventListener(updateNorthArrow);

        // Let users drag the north arrow off whatever it covers (e.g. the info box).
        (function () {
            const arrow = document.getElementById('northArrow');
            let offsetX = 0, offsetY = 0;
            arrow.title = 'Drag to move';
            arrow.addEventListener('pointerdown', function (e) {
                // offsetLeft/Top ignore the heading rotation, so the arrow doesn't jump on grab.
                offsetX = e.clientX - arrow.offsetLeft;
                offsetY = e.clientY - arrow.offsetTop;
                arrow.setPointerCapture(e.pointerId);
                arrow.classList.add('is-dragging');
                e.preventDefault();
            });
            arrow.addEventListener('pointermove', function (e) {
                if (!arrow.hasPointerCapture(e.pointerId)) return;
                const maxX = window.innerWidth - arrow.offsetWidth;
                const maxY = window.innerHeight - arrow.offsetHeight;
                arrow.style.left = Math.min(Math.max(0, e.clientX - offsetX), maxX) + 'px';
                arrow.style.top = Math.min(Math.max(0, e.clientY - offsetY), maxY) + 'px';
                arrow.style.right = 'auto';
            });
            function endDrag(e) {
                if (arrow.hasPointerCapture(e.pointerId)) arrow.releasePointerCapture(e.pointerId);
                arrow.classList.remove('is-dragging');
            }
            arrow.addEventListener('pointerup', endDrag);
            arrow.addEventListener('pointercancel', endDrag);
        })();

        // ---- High-res button in the infoBox popup ----
        // Expose a global so the button inside the infoBox iframe can call back out
        window.loadHighResFromPopup = async function (faultId) {
            faultId = String(faultId);
            const statusDiv = document.getElementById('highResStatus');

            // If already loaded, do nothing
            if (loadedHighResFaults[faultId]) {
                statusDiv.innerText = 'Already loaded.';
                statusDiv.style.color = '#64748b';
                return;
            }

            statusDiv.innerText = 'Loading high-res...';
            statusDiv.style.color = '#0b4a53';

            // Hide low-res entities for this fault
            let ds = findCfmSurfacesDS();
            if (ds) {
                ds.entities.values.forEach(entity => {
                    if (entity.properties && entity.properties.CFM_ID) {
                        let eId = String(typeof entity.properties.CFM_ID.getValue === 'function'
                            ? entity.properties.CFM_ID.getValue() : entity.properties.CFM_ID);
                        if (eId === faultId) {
                            entity.show = false;
                            if (!hiddenLowResEntities[faultId]) hiddenLowResEntities[faultId] = [];
                            hiddenLowResEntities[faultId].push(entity);
                        }
                    }
                });
            }

            try {
                let hiresUrl = githubBaseUrl + 'hires_faults/' + faultId + '_hires.geojson';
                let dataSource = await Cesium.GeoJsonDataSource.load(hiresUrl, {
                    stroke: Cesium.Color.CYAN,
                    fill: Cesium.Color.CYAN.withAlpha(0.5),
                    strokeWidth: 3
                });
                viewer.dataSources.add(dataSource);
                loadedHighResFaults[faultId] = dataSource;
                statusDiv.innerText = 'High-res faults loaded!';
                statusDiv.style.color = '#0b4a53';
            } catch (err) {
                statusDiv.innerText = 'Failed to load high-res.';
                statusDiv.style.color = '#dc2626';
                console.error('High-res load error:', err);
            }
        };

        // Append a Load High-Res button to the infoBox description whenever a CFM surface is selected
        viewer.selectedEntityChanged.addEventListener(function (entity) {
            if (!entity || !entity.properties) return;
            let cfmId = entity.properties.CFM_ID;
            if (!cfmId) return;
            let id = String(typeof cfmId.getValue === 'function' ? cfmId.getValue() : cfmId);
            if (!id) return;

            // Append button only once per entity
            let base = entity.description ? entity.description.getValue() : '';
            if (base.indexOf('loadHighResFromPopup') !== -1) return;
            entity.description =
                base +
                '<hr style="border:none;border-top:1px solid #e2e8f0;margin:10px 0">' +
                '<button onclick="parent.loadHighResFromPopup(\'' + id + '\')" ' +
                'style="' +
                  'background:#0b4a53;color:#fff;border:none;border-radius:8px;' +
                  'padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;' +
                  'font-family:Inter,sans-serif;width:100%;margin-top:4px;' +
                '">' +
                '&#9652; Load High-Res 1 km (ID: ' + id + ')' +
                '</button>';
        });

        // Centered view button functionality
        document.getElementById('centerViewButton').addEventListener('click', function () {
            // Get the coordinates from the input box
            const coordinates = document.getElementById('centerCoordinates').value.split(',');
            const lon = parseFloat(coordinates[0]);
            const lat = parseFloat(coordinates[1]);

            // Calculate the bounding box dimensions
            const width = east - west;
            const height = north - south;
            const maxDimension = Math.max(width, height);

            // Estimate height based on the bounding box size
            const estimatedHeight = maxDimension * 111000 * zoomOutFactor; // 111,000 meters per degree

            // Move the camera to the new coordinates with the estimated height
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(lon, lat, estimatedHeight),
                orientation: {
                    heading: 0.0,
                    pitch: Cesium.Math.toRadians(-90.0), // Looking straight down
                    roll: 0.0
                }
            });
        });


        // Hide/open the menu button — shows both cards
        document.getElementById('toggleButton').addEventListener('click', function () {
            var wrapper = document.getElementById('cardWrapper');
            var toggleButton = document.getElementById('toggleButton');
            const isHidden = window.getComputedStyle(wrapper).display === 'none';
            if (isHidden) {
                wrapper.style.display = 'block';
                toggleButton.innerHTML = '▲ Show/Hide Controls';
            } else {
                wrapper.style.display = 'none';
                toggleButton.innerHTML = '▼ Show/Hide Controls';
            }
        });


        // Home view.
        function homeView() {
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(initialFlyTO[0], initialFlyTO[1], initialFlyTO[2]),
                orientation: {
                    heading: Cesium.Math.toRadians(initialHeading),
                    pitch: Cesium.Math.toRadians(initialPitch),
                    roll: initialRoll
                }
            });
        }
        // Override the home button functionality
        viewer.homeButton.viewModel.command.beforeExecute.addEventListener(function (e) {
            e.cancel = true; // Prevent the default home button action
            homeView()

        });

        // Add the home button functionality
        document.getElementById("homeViewButton").addEventListener('click', function () {
            homeView()

        });

        // Function to read and clear an item from localStorage
        function readAndClearLocalStorageItem(key) {
            // Step 1: Read the item from localStorage
            const item = localStorage.getItem(key);

            // Step 2: Remove the item from localStorage
            localStorage.removeItem(key);

            // Step 3: Return the parsed item, or null if it doesn't exist
            return item !== null ? JSON.parse(item) : null;
        }

        // Usage example to get selectedLines
        const selectedLines = readAndClearLocalStorageItem('selectedLines') || [];
        console.log('Selected lines:', selectedLines);

        viewer.scene.globe.frontFaceAlphaByDistance = new Cesium.NearFarScalar(50.0, 0.0, 100.0, 1.0);
        viewer.scene.globe.show = false;
        viewer.scene.fog.enabled = false;
        viewer.scene.globe.showGroundAtmosphere = false;
        // Off by default: every fault is below ground, so occlusion would hide them all.
        viewer.scene.globe.depthTestAgainstTerrain = false;

        const toggleTerrainOcclusionCheckbox = document.getElementById('toggleTerrainOcclusionCheckbox');
        toggleTerrainOcclusionCheckbox.addEventListener('change', function () {
            viewer.scene.globe.depthTestAgainstTerrain = toggleTerrainOcclusionCheckbox.checked;
        });

        viewer.scene.setTerrain(new Cesium.Terrain(
            Cesium.CesiumTerrainProvider.fromIonAssetId(2426648)
                .catch(function () { return Cesium.CesiumTerrainProvider.fromIonAssetId(1); })
        ));
        const scene = viewer.scene;
        const globe = scene.globe;
        const camera = scene.camera;

        scene.fog.enabled = false;
        globe.showGroundAtmosphere = false;
        globe.enableLighting = true;

        scene.light = new Cesium.DirectionalLight({
            direction: new Cesium.Cartesian3(1, 0, 0),
        });

        const scratchNormal = new Cesium.Cartesian3();
        scene.preRender.addEventListener(function (scene, time) {
            const surfaceNormal = globe.ellipsoid.geodeticSurfaceNormal(camera.positionWC, scratchNormal);
            const negativeNormal = Cesium.Cartesian3.negate(surfaceNormal, surfaceNormal);
            scene.light.direction = Cesium.Cartesian3.normalize(Cesium.Cartesian3.add(negativeNormal, camera.rightWC, surfaceNormal), scene.light.direction);
        });

        globe.maximumScreenSpaceError = 1.0;

        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(initialFlyTO[0], initialFlyTO[1], initialFlyTO[2]),
            orientation: {
                heading: Cesium.Math.toRadians(initialHeading),
                pitch: Cesium.Math.toRadians(initialPitch),
                roll: initialRoll
            }
        });

        viewer.animation.container.style.visibility = 'hidden';
        viewer.timeline.container.style.visibility = 'hidden';

        // Earthquakes.
        async function loadEarthquakeData(url) {
            try {
                const dataSource = await Cesium.GeoJsonDataSource.load(url, {
                    clampToGround: false
                });
                earthquakeDataSource = dataSource;
                viewer.dataSources.add(dataSource);
                updateEarthquakeVisibility();

                const entities = dataSource.entities.values;
                const circleSizeSlider = document.getElementById('circleSizeSlider');
                const now = Cesium.JulianDate.now();
                entities.forEach(function (entity) {
                    entity.billboard = undefined;
                    if (entity.position) {
                        // USGS GeoJSON stores depth (km) as the third coordinate, which Cesium reads as height.
                        let coordinates = Cesium.Cartographic.fromCartesian(entity.position.getValue(now));
                        const lon = Cesium.Math.toDegrees(coordinates.longitude);
                        const lat = Cesium.Math.toDegrees(coordinates.latitude);
                        const depthKm = coordinates.height;
                        entity.position = new Cesium.ConstantPositionProperty(Cesium.Cartesian3.fromDegrees(lon, lat, -depthKm * 1000));
                        describeEarthquake(entity, lon, lat, depthKm, now);
                    }
                    entity.point = new Cesium.PointGraphics({
                        pixelSize: calculateMarkerSize(circleSizeSlider.value, entity.properties.mag.getValue()),
                        color: eqColor
                    });
                });
            } catch (error) {
                console.log('Error loading earthquake data:', error);
            }
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function describeEarthquake(entity, lon, lat, depthKm, now) {
            const p = entity.properties;
            const get = function (key) { return p[key] ? p[key].getValue(now) : undefined; };
            const comcatId = (get('net') || '') + (get('code') || '') || entity.id;
            const mag = get('mag');
            const magType = get('magType');
            const time = get('time');
            const place = get('place');
            const url = get('url');

            const rows = [
                ['ComCat ID', url
                    ? '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(comcatId) + '</a>'
                    : escapeHtml(comcatId)],
                ['Magnitude', mag != null ? escapeHtml(mag.toFixed(1) + (magType ? ' ' + magType : '')) : 'n/a'],
                ['Latitude', lat.toFixed(4) + '&deg;'],
                ['Longitude', lon.toFixed(4) + '&deg;'],
                ['Depth', depthKm.toFixed(1) + ' km'],
                ['Time (UTC)', time != null ? escapeHtml(new Date(time).toISOString().replace('T', ' ').slice(0, 19)) : 'n/a'],
                ['Location', place ? escapeHtml(place) : 'n/a']
            ];
            entity.name = 'ComCat ID: ' + comcatId;
            entity.description = '<table class="cesium-infoBox-defaultTable"><tbody>' +
                rows.map(function (r) { return '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>'; }).join('') +
                '</tbody></table>';
        }

        // Earthquakes
        loadEarthquakeData(eqQueryUrl);

        function updateEarthquakeVisibility() {
            var checked = document.getElementById('showEarthquakesCheckbox').checked;
            if (earthquakeDataSource) {
                earthquakeDataSource.show = checked;
            }
            document.getElementById('eqcontrols').style.display = checked ? '' : 'none';
        }

        document.getElementById('showEarthquakesCheckbox').addEventListener('change', updateEarthquakeVisibility);
        function calculateMarkerSize(baseSize, magnitude) {
            const scaleFactor = 3;
            return parseFloat(baseSize) * Math.pow(magnitude, scaleFactor);
        }

        document.getElementById('circleSizeSlider').addEventListener('input', function () {
            if (!earthquakeDataSource) return;
            const size = parseFloat(this.value);
            const now = Cesium.JulianDate.now();
            earthquakeDataSource.entities.values.forEach(function (entity) {
                const mag = entity?.properties?.mag?.getValue?.(now) ?? 1;
                entity.point = new Cesium.PointGraphics({
                    color: eqColor,
                    pixelSize: calculateMarkerSize(size, mag)
                });
            });
        });

        // Draw a polygon showing the study area
        // Create the positions for the polygon
        const positions = Cesium.Cartesian3.fromDegreesArray([
            west, north,
            east, north,
            east, south,
            west, south
        ]);

        // Add the polygon entity to the viewer
        viewer.entities.add({
            name: "study area",
            polygon: {
                hierarchy: new Cesium.PolygonHierarchy(positions),
                material: cfmAreaFaceColor[0].withAlpha(cfmAreaFillOpacity[0]), // Cyan color with 50% transparency
                perPositionHeight: true, // Allow different heights for each vertex
                outline: true,
                outlineColor: cfmAreaOutlineColor[0]
            }
        });

        // Define the corner coordinates with labels
        const corners = [
            { lon: west, lat: north, label: 'NW', coordinates: `${west.toFixed(1)}, ${north.toFixed(1)}` },
            { lon: east, lat: north, label: 'NE', coordinates: `${east.toFixed(1)}, ${north.toFixed(1)}` },
            { lon: east, lat: south, label: 'SE', coordinates: `${east.toFixed(1)}, ${south.toFixed(1)}` },
            { lon: west, lat: south, label: 'SW', coordinates: `${west.toFixed(1)}, ${south.toFixed(1)}` }
        ];

        // Add labels to each corner
        corners.forEach(corner => {
            viewer.entities.add({
                position: Cesium.Cartesian3.fromDegrees(corner.lon, corner.lat),
                point: {
                    pixelSize: 10,
                    color: Cesium.Color.RED
                },
                label: {
                    text: `${corner.label}\n${corner.coordinates}`,
                    font: '14pt sans-serif',
                    fillColor: Cesium.Color.YELLOW,
                    outlineColor: Cesium.Color.BLACK,
                    outlineWidth: 2,
                    style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                    verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                    pixelOffset: new Cesium.Cartesian2(0, -20) // Adjust label position
                }
            });
        });

        // Primary legends.
        var legendContainer = document.getElementById('legendContainer');
        primaryLegendLabel.forEach(function (labelText, i) {
            var legendItem = document.createElement('div');
            legendItem.classList.add('legendItem');

            var legendColor = document.createElement('div');
            legendColor.classList.add('legendColor');
            legendColor.style.backgroundColor = primaryLegendColor[i].toCssColorString();

            var legendLabel = document.createElement('span');
            legendLabel.textContent = labelText;

            legendItem.appendChild(legendColor);
            legendItem.appendChild(legendLabel);
            legendContainer.appendChild(legendItem);
        });

        // Separator between primary and aux groups
        var sep = document.createElement('div');
        sep.classList.add('legend-sep');
        legendContainer.appendChild(sep);

        // Auxiliary legends.
        auxLegendColor.forEach(function (color, i) {
            var legendItem = document.createElement('div');
            legendItem.classList.add('legendItem');

            var legendColor = document.createElement('div');
            legendColor.classList.add('legendColor');
            legendColor.style.backgroundColor = color.toCssColorString();

            var legendLabel = document.createElement('span');
            legendLabel.textContent = auxLegendLabel[i];

            legendItem.appendChild(legendColor);
            legendItem.appendChild(legendLabel);
            legendContainer.appendChild(legendItem);
        });

        // Subducting plate surface entries join the bottom legend so the legend toggle hides them too.
        legendContainer.appendChild(document.getElementById('legend'));

        var points = [];
        var distanceDisplay = document.getElementById('distanceDisplay');

        // Measure distance.
        function calculateDistance(point1, point2) {
            return Cesium.Cartesian3.distance(point1, point2);
        }

        function updateDistanceDisplay(distance) {
            distanceDisplay.textContent = 'Distance: ' + distance.toFixed(2) + ' meters';
        }


        let distanceEntities = [];
        function clearDistance() {
            points = [];
            distanceDisplay.textContent = '';
            distanceEntities.forEach(e => viewer.entities.remove(e));
            distanceEntities = [];
        }

        var handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
        handler.setInputAction(function (click) {
            var cartesian = viewer.camera.pickEllipsoid(click.position, viewer.scene.globe.ellipsoid);
            if (cartesian) {
                if (document.getElementById('clearCheckbox').checked) {
                    points.push(cartesian);
                }
                if (points.length >= 2) {
                    var distance = calculateDistance(points[points.length - 2], points[points.length - 1]);
                    updateDistanceDisplay(distance);
                    const line = viewer.entities.add({ polyline: { positions: points, width: 2, material: Cesium.Color.TEAL } });
                    distanceEntities.push(line);
                }
            }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        document.getElementById('clearCheckbox').addEventListener('change', function () {
            if (!this.checked) {
                clearDistance();
            }
        });

        // Picking a layer in the imagery picker should show it, so turn Satellite imagery on.
        Cesium.knockout.getObservable(viewer.baseLayerPicker.viewModel, 'selectedImagery').subscribe(function () {
            const globeBox = document.getElementById('toggleGlobeCheckbox');
            if (!globeBox.checked) {
                globeBox.checked = true;
                globeBox.dispatchEvent(new Event('change'));
            }
        });

        document.getElementById('toggleGlobeCheckbox').addEventListener('change', function () {
            viewer.scene.globe.show = this.checked;
            // Occlusion needs the terrain surface, which only renders while the globe is shown.
            const occlusion = document.getElementById('toggleTerrainOcclusionCheckbox');
            occlusion.disabled = !this.checked;
            document.getElementById('terrainOcclusionLabel').title = this.checked
                ? 'Hide faults and earthquakes that are below the terrain surface'
                : 'Turn on Satellite imagery to use this';
        });

// =====================================================================
// CRESCENT CFM HIGH-RES FAULT VIEWER LOGIC
// =====================================================================

// Hoisted so loadHighResFromPopup (defined above) can access these
const githubBaseUrl = "https://raw.githubusercontent.com/cascadiaquakes/CRESCENT-CFM/dev/crescent_cfm_files/";
const loadedHighResFaults = {};
const hiddenLowResEntities = {};

// Direct reference to the CFM surfaces datasource, set when it loads
let cfmSurfacesDS = null;
function findCfmSurfacesDS() {
    return cfmSurfacesDS;
}

setTimeout(() => {
    const listUrl = githubBaseUrl + "crescent_cfm_crustal_3d_lowres.geojson";

    // findCfmSurfacesDS is hoisted above setTimeout so loadHighResFromPopup can use it

    fetch(listUrl)
        .then(response => response.json())
        .then(data => {
            const selectBox = document.getElementById('selectHighResFaults');
            const features = data.features.sort((a, b) => {
                let nameA = a.properties.name || '';
                let nameB = b.properties.name || '';
                return nameA.localeCompare(nameB);
            });
            features.forEach(feat => {
                let id = feat.properties.id || feat.properties.CFM_ID;
                let name = feat.properties.name || 'Fault ' + id;
                if(id) {
                    let option = document.createElement('option');
                    option.value = id;
                    option.text = name + ' (ID: ' + id + ')';
                    selectBox.appendChild(option);
                }
            });
        })
        .catch(err => console.error("Error loading fault list:", err));

    document.getElementById('loadHighResBtn').addEventListener('click', async () => {
        const selectBox = document.getElementById('selectHighResFaults');
        const statusDiv = document.getElementById('highResStatus');
        const selectedOptions = Array.from(selectBox.selectedOptions);
        if (selectedOptions.length === 0) {
            statusDiv.innerText = "Please select at least one fault.";
            statusDiv.style.color = "#dc2626";
            return;
        }
        if (selectedOptions.length > 10) {
            statusDiv.innerText = "Max 10 faults. You selected " + selectedOptions.length + ".";
            statusDiv.style.color = "#dc2626";
            return;
        }

        // Clear previous high-res and restore previous low-res
        for (let faultId in loadedHighResFaults) {
            let ds = loadedHighResFaults[faultId];
            if (viewer.dataSources.contains(ds)) viewer.dataSources.remove(ds);
        }
        for (let faultId in hiddenLowResEntities) {
            hiddenLowResEntities[faultId].forEach(e => { e.show = true; });
        }
        for (let key in loadedHighResFaults) delete loadedHighResFaults[key];
        for (let key in hiddenLowResEntities) delete hiddenLowResEntities[key];

        statusDiv.innerText = 'Loading ' + selectedOptions.length + ' high-res fault(s)...';
        statusDiv.style.color = "#0b4a53";

        let ds = findCfmSurfacesDS();

        for (let option of selectedOptions) {
            let faultId = String(option.value);
            let hiresUrl = githubBaseUrl + 'hires_faults/' + faultId + '_hires.geojson';
            try {
                // Hide low-res triangles for this fault
                if (ds) {
                    ds.entities.values.forEach(entity => {
                        if (entity.properties && entity.properties.CFM_ID) {
                            let eId = String(typeof entity.properties.CFM_ID.getValue === 'function' ? entity.properties.CFM_ID.getValue() : entity.properties.CFM_ID);
                            if (eId === faultId) {
                                entity.show = false;
                                if (!hiddenLowResEntities[faultId]) hiddenLowResEntities[faultId] = [];
                                hiddenLowResEntities[faultId].push(entity);
                            }
                        }
                    });
                }
                // Load high-res
                let dataSource = await Cesium.GeoJsonDataSource.load(hiresUrl, {
                    stroke: Cesium.Color.CYAN,
                    fill: Cesium.Color.CYAN.withAlpha(0.5),
                    strokeWidth: 3
                });
                viewer.dataSources.add(dataSource);
                loadedHighResFaults[faultId] = dataSource;
            } catch (err) {
                console.error('Failed to load high-res fault ' + faultId + ':', err);
            }
        }
        statusDiv.innerText = "High-res faults loaded!";
        statusDiv.style.color = "#0b4a53";
    });

    document.getElementById('resetHighResBtn').addEventListener('click', () => {
        const statusDiv = document.getElementById('highResStatus');
        for (let faultId in loadedHighResFaults) {
            let ds = loadedHighResFaults[faultId];
            if (viewer.dataSources.contains(ds)) viewer.dataSources.remove(ds);
        }
        for (let faultId in hiddenLowResEntities) {
            hiddenLowResEntities[faultId].forEach(e => { e.show = true; });
        }
        for (let key in loadedHighResFaults) delete loadedHighResFaults[key];
        for (let key in hiddenLowResEntities) delete hiddenLowResEntities[key];
        document.getElementById('selectHighResFaults').selectedIndex = -1;
        statusDiv.innerText = "Reset complete. Showing low-res.";
        statusDiv.style.color = "#64748b";
    });
}, 2000);

    // Add title tooltips to truncated select options so full name shows on hover
    ['selectHighResFaults', 'select2dSurface'].forEach(function(id) {
        var sel = document.getElementById(id);
        if (!sel) return;
        new MutationObserver(function() {
            Array.from(sel.options).forEach(function(o) { o.title = o.text; });
        }).observe(sel, { childList: true });
        Array.from(sel.options).forEach(function(o) { o.title = o.text; });
    });

    // Prevent panel scroll from bleeding into Cesium
    var wrapper = document.getElementById('cardWrapper');
    if (wrapper) wrapper.addEventListener('wheel', function(e) { e.stopPropagation(); }, { passive: false });

    // Legend toggle button
    (function() {
        const legend = document.getElementById('legendContainer');
        const toggleBtn = document.getElementById('toggle-legend');
        if (!legend || !toggleBtn) return;
        toggleBtn.addEventListener('click', function() {
            if (legend.classList.contains('is-open')) {
                legend.classList.remove('is-open');
                legend.classList.add('is-closed');
                toggleBtn.classList.add('is-active');
            } else {
                legend.classList.remove('is-closed');
                legend.classList.add('is-open');
                toggleBtn.classList.remove('is-active');
            }
        });
    })();

    </script>
